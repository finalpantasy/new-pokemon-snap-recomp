<!doctype html><meta charset=utf-8><title>Photo gallery</title>
<style>body{font:14px sans-serif;background:#111;color:#eee;margin:0}header{padding:8px;position:sticky;top:0;background:#222}
#g{display:grid;grid-template-columns:repeat(auto-fill,160px);gap:6px;padding:8px}#g img{width:160px;cursor:pointer}
#lb{display:none;position:fixed;inset:0;background:#000d;align-items:center;justify-content:center}#lb img{max-width:95vw;max-height:95vh}</style>
<header>Course <select id=c></select> Species <select id=s></select> Sort <select id=o>
<option value=id>Order taken</option><option value=score>Score</option><option value=date>Date</option></select> <span id=n></span></header>
<div id=g></div><div id=lb onclick="this.style.display='none'"><img></div>
<script>
let P=[];const $=i=>document.getElementById(i);
function fill(sel,key){const v=[...new Set(P.map(p=>p[key]).filter(x=>x!=null))].sort();sel.innerHTML='<option value="">all</option>'+v.map(x=>`<option>${x}</option>`).join('')}
function draw(){const c=$('c').value,s=$('s').value,o=$('o').value;
 let L=P.filter(p=>(!c||String(p.course)==c)&&(!s||String(p.species)==s));
 L.sort((a,b)=>o=='id'?a.id-b.id:(b[o]??-1)-(a[o]??-1));$('n').textContent=L.length+' photos';
 $('g').innerHTML='';for(const p of L){const i=new Image();i.loading='lazy';i.src='/data/'+(p.thumb||p.full);i.title=`#${p.id} course ${p.course??'?'} species ${p.species??'?'} score ${p.score??'?'}`;
  i.onclick=()=>{$('lb').firstChild.src='/data/'+p.full;$('lb').style.display='flex'};$('g').append(i)}}
fetch('/data/photos.json').then(r=>r.json()).then(j=>{P=j.photos;fill($('c'),'course');fill($('s'),'species');draw()}).catch(()=>$('n').textContent='no photos yet');
for(const i of['c','s','o'])$(i).onchange=draw;
</script>
